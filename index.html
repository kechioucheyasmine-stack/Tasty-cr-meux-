<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tasty & Crémeux — Commandes</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; background: #080909; color: #f5f0e8; }
    header { padding: 25px 20px; text-align: center; background: #080909; border-bottom: 2px solid #f59a00; }
    .couronne { font-size: 42px; }
    h1 { margin: 5px 0; font-size: 30px; text-transform: uppercase; }
    h1 span { color: #f59a00; }
    main { max-width: 800px; margin: auto; padding: 25px 16px; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 25px; }
    .stat { padding: 18px 8px; text-align: center; background: #111313; border: 1px solid #292929; border-radius: 14px; }
    .stat strong { display: block; color: #f59a00; font-size: 24px; }
    .stat small { color: #c9c3bb; }
    .commande { margin-bottom: 18px; padding: 20px; background: #111313; border: 1px solid #333; border-radius: 18px; }
    .commande.nouvelle { border-color: #f59a00; }
    .commande h2 { margin-top: 0; font-size: 20px; }
    .commande h2 span { color: #f59a00; }
    .details { color: #d8d2ca; line-height: 1.7; }
    .total { margin: 15px 0; color: #f59a00; font-size: 22px; font-weight: bold; }
    button { width: 100%; padding: 14px; border: 0; border-radius: 10px; background: #f59a00; color: #080909; font-size: 16px; font-weight: bold; cursor: pointer; }
    .vide { padding: 30px; text-align: center; background: #111313; border-radius: 16px; color: #aaa; }
    footer { padding: 30px; text-align: center; color: #777; }
    .commande-client { margin-top: 12px; padding: 15px; background: #080909; border-radius: 12px; }
    .commande-client strong { color: #f59a00; }
  </style>
</head>
<body>

<header>
  <div class="couronne">👑</div>
  <h1>Tasty <span>& Crémeux</span></h1>
  <p>Tableau de bord des commandes</p>
</header>

<main>
  <div class="stats">
    <div class="stat">
      <strong id="nombreNouvelles">0</strong>
      <small>Nouvelles</small>
    </div>
    <div class="stat">
      <strong>0</strong>
      <small>En préparation</small>
    </div>
    <div class="stat">
      <strong id="totalJour">0 €</strong>
      <small>Aujourd'hui</small>
    </div>
  </div>

  <div class="commande nouvelle">
    <h2>🔴 <span>Nouvelles commandes</span></h2>
    <div id="listeCommandes">
      <div class="vide">Chargement des commandes...</div>
    </div>
  </div>
</main>

<footer>
  👑 Tasty & Crémeux — Espace commandes
</footer>

<script>
const SUPABASE_URL = "https://jeyvtkutqlaasadckkts.supabase.co";
const SUPABASE_ANON_KEY = "COLLE_TA_CLE_PUBLISHABLE_ICI";

async function chargerCommandes() {
  const liste = document.getElementById("listeCommandes");
  const nombreNouvelles = document.getElementById("nombreNouvelles");
  const totalJour = document.getElementById("totalJour");

  try {
    const reponse = await fetch(
      SUPABASE_URL + "/rest/v1/orders?select=*&order=created_at.desc",
      {
        headers: {
          "apikey": SUPABASE_ANON_KEY,
          "Authorization": "Bearer " + SUPABASE_ANON_KEY
        }
      }
    );

    if (!reponse.ok) {
      throw new Error("Impossible de récupérer les commandes.");
    }

    const commandes = await reponse.json();

    nombreNouvelles.textContent = commandes.length;

    const aujourdHui = new Date().toISOString().slice(0, 10);

    const commandesDuJour = commandes.filter(commande =>
      commande.created_at &&
      commande.created_at.slice(0, 10) === aujourdHui
    );

    const total = commandesDuJour.reduce(
      (somme, commande) => somme + Number(commande.total || 0),
      0
    );

    totalJour.textContent = total.toFixed(2).replace(".", ",") + " €";

    if (commandes.length === 0) {
      liste.innerHTML = '<div class="vide">Aucune commande pour le moment.</div>';
      return;
    }

    liste.innerHTML = commandes.map(commande => `
      <div class="commande-client">
        <strong>👑 Commande #${commande.id}</strong>
        <div class="details">
          <strong>Nom :</strong> ${echapper(commande.customer_name || "")}<br>
          <strong>Téléphone :</strong> ${echapper(commande.customer_phone || "")}<br>
          <strong>Adresse :</strong> ${echapper(commande.customer_address || "")}<br>
          <strong>Date :</strong> ${new Date(commande.created_at).toLocaleString("fr-FR")}
          ${commande.mode ? `<br><strong>Mode :</strong> ${echapper(commande.mode)}` : ""}
          ${commande.note ? `<br><strong>Note :</strong> ${echapper(commande.note)}` : ""}
          ${commande.order_details ? `<br><br><strong>Commande :</strong><br>${echapper(commande.order_details).replace(/\n/g, "<br>")}` : ""}
        </div>
        ${commande.total ? `<div class="total">${Number(commande.total).toFixed(2).replace(".", ",")} €</div>` : ""}
      </div>
    `).join("");

  } catch (erreur) {
    console.error(erreur);
    liste.innerHTML = '<div class="vide">Impossible de charger les commandes.</div>';
  }
}

function echapper(texte) {
  const div = document.createElement("div");
  div.textContent = texte;
  return div.innerHTML;
}

chargerCommandes();
setInterval(chargerCommandes, 10000);
</script>

</body>
</html>
